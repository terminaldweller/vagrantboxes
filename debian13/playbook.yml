---
- name: configure debian trixie
  hosts: all
  become: true
  gather_facts: true

  vars:
    managed_user: vagrant
    managed_group: vagrant
    managed_home: /home/vagrant

    nym_repo_setup_version: "2.0.1"
    nym_repo_setup_deb: >-
      /var/cache/apt/archives/nym-repo-setup_{{ nym_repo_setup_version }}_all.deb

    fzf_source_dir: "{{ managed_home }}/src/fzf"
    fzf_version: v0.74.3
    scripts_source_dir: "{{ managed_home }}/scripts"
    minimalrc_source_dir: "{{ managed_home }}/minimalrc"
    fzfgit_source_dir: "{{ managed_home }}/devi/fzf-git.sh"
    p10k_source_dir: "{{ managed_home }}/powerlevel10k"

    base_packages:
      - build-essential
      - ca-certificates
      - curl
      - wget
      - extrepo
      - git
      - htop
      - jq
      - rsync
      - tmux
      - vim-nox
      - ripgrep
      - traceroute
      - automake
      - cmake
      - bear
      - ninja-build
      - meson
      - clang
      - gdb
      - eza
      - zsh
      - zsh-syntax-highlighting
      - zsh-autosuggestions
      - fd-find
      - du-dust
      - irssi
      - profanity
      - w3m
      - lynx
      - gnupg
      - bind9-dnsutils
      - socat
      - tcpdump
      - iptraf-ng
      - netcat-openbsd
      - lnav
      - conntrack
      - lf
      - bat
      - python3-pip
      - pipx
      - openssh-server
      - endlessh
      - ufw
      - apparmor
      - apparmor-utils
      - chrony
      - jitterentropy-rngd
      - haveged
      - sshguard
      - lynis
      - zoxide
      - grc

    docker_conflicting_packages:
      - containerd
      - docker-compose
      - docker-doc
      - docker.io
      - podman-docker
      - runc

    docker_packages:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin

    ufw_allow_rules:
      - port: "22"
        comment: "allow sshd"
      - port: "2222"
        comment: "allow endlessh"

  tasks:
    - name: Require Debian 13 or newer
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] == "Debian"
          - ansible_facts["distribution_major_version"] | int >= 13
        fail_msg: This playbook expects Debian 13 or newer.

    - name: Install base packages
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade installed packages
      ansible.builtin.apt:
        upgrade: safe
        update_cache: true

    - name: Enable periodic apt upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: Enable APT update timers
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

    - name: Enable the mise APT repository
      ansible.builtin.command:
        argv:
          - extrepo
          - enable
          - mise
        creates: /etc/apt/sources.list.d/extrepo_mise.sources
      register: mise_repository

    - name: Refresh APT metadata after enabling the mise repository
      ansible.builtin.apt:
        update_cache: true
      when: mise_repository.changed

    - name: Download the Nym repository setup package
      ansible.builtin.get_url:
        url: >-
          https://apt-ppa.nym.com/pool/main/n/nym-repo-setup/nym-repo-setup_{{ nym_repo_setup_version }}_all.deb
        dest: "{{ nym_repo_setup_deb }}"
        owner: root
        group: root
        mode: "0644"

    - name: Install the Nym APT repository
      ansible.builtin.apt:
        deb: "{{ nym_repo_setup_deb }}"
        state: present
      register: nym_repository

    - name: Refresh APT metadata after adding the Nym repository
      ansible.builtin.apt:
        update_cache: true
      when: nym_repository.changed

    - name: Uninstall NymVPN
      ansible.builtin.apt:
        name: nym-vpn-app
        state: absent

    - name: Install the NymVPN daemon and CLI
      ansible.builtin.apt:
        name:
          - nym-vpnd
          - nym-vpnc
        state: present

    - name: Install mise
      ansible.builtin.apt:
        name: mise
        state: present

    - name: Verify the mise installation
      ansible.builtin.command:
        argv:
          - /usr/bin/mise
          - --version
      changed_when: false

    - name: Install rustup
      ansible.builtin.apt:
        name: rustup
        state: present

    - name: Read the current default Rust toolchain
      ansible.builtin.command:
        argv:
          - /usr/bin/rustup
          - default
      become_user: "{{ managed_user }}"
      environment:
        HOME: "{{ managed_home }}"
        CARGO_HOME: "{{ managed_home }}/.cargo"
        RUSTUP_HOME: "{{ managed_home }}/.rustup"
      register: rustup_default
      changed_when: false
      failed_when: false

    - name: Install stable Rust and make it the default
      ansible.builtin.command:
        argv:
          - /usr/bin/rustup
          - default
          - stable
      become_user: "{{ managed_user }}"
      environment:
        HOME: "{{ managed_home }}"
        CARGO_HOME: "{{ managed_home }}/.cargo"
        RUSTUP_HOME: "{{ managed_home }}/.rustup"
      when:
        - >
          rustup_default.rc != 0 or
          not (rustup_default.stdout | default('')).startswith('stable')

    - name: Verify the Rust installation
      ansible.builtin.command:
        argv:
          - /usr/bin/rustc
          - --version
      become_user: "{{ managed_user }}"
      environment:
        HOME: "{{ managed_home }}"
        CARGO_HOME: "{{ managed_home }}/.cargo"
        RUSTUP_HOME: "{{ managed_home }}/.rustup"
      changed_when: false

    - name: Create the user source directory
      ansible.builtin.file:
        path: "{{ managed_home }}/src"
        state: directory
        owner: "{{ managed_user }}"
        group: "{{ managed_group }}"
        mode: "0755"

    - name: Clone the fzf repository
      ansible.builtin.git:
        repo: https://github.com/junegunn/fzf.git
        dest: "{{ fzf_source_dir }}"
        version: "{{ fzf_version }}"
        depth: 1
        update: true
      become_user: "{{ managed_user }}"
      environment:
        HOME: "{{ managed_home }}"
      register: fzf_source

    - name: Check whether fzf has already been built
      ansible.builtin.stat:
        path: "{{ fzf_source_dir }}/bin/fzf"
      register: fzf_binary

    - name: Build fzf from source
      ansible.builtin.command:
        argv:
          - /usr/bin/mise
          - exec
          - go@1.27.0
          - --
          - make
          - install
        chdir: "{{ fzf_source_dir }}"
      become_user: "{{ managed_user }}"
      environment:
        HOME: "{{ managed_home }}"
      when: fzf_source.changed or not fzf_binary.stat.exists

    - name: Link fzf into /usr/local/bin
      ansible.builtin.file:
        src: "{{ fzf_source_dir }}/bin/fzf"
        dest: /usr/local/bin/fzf
        state: link
        owner: root
        group: root

    - name: Verify the fzf build
      ansible.builtin.command:
        argv:
          - /usr/local/bin/fzf
          - --version
      changed_when: false

    - name: Remove packages that conflict with Docker CE
      ansible.builtin.apt:
        name: "{{ docker_conflicting_packages }}"
        state: absent

    - name: Add the Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types:
          - deb
        uris:
          - https://download.docker.com/linux/debian
        suites:
          - "{{ ansible_facts['distribution_release'] }}"
        components:
          - stable
        architectures:
          - amd64
        signed_by: https://download.docker.com/linux/debian/gpg
        state: present
      register: docker_repository

    - name: Refresh APT metadata after adding Docker repository
      ansible.builtin.apt:
        update_cache: true
      when: docker_repository.changed

    - name: Install Docker
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present

    - name: Create the Docker configuration directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure the Docker daemon
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "ipv6": true,
            "live-restore": true,
            "runtimes": {
              "runsc": {
                "path": "/usr/bin/runsc"
              }
            }
          }
      notify: Restart Docker

    - name: Add the managed user to the docker group
      ansible.builtin.user:
        name: "{{ managed_user }}"
        groups:
          - docker
        append: true

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Clone user repositories
      ansible.builtin.git:
        repo: "{{ item.repo }}"
        dest: "{{ item.dest }}"
        update: true
      become_user: "{{ managed_user }}"
      environment:
        HOME: "{{ managed_home }}"
      loop:
        - repo: https://github.com/terminaldweller/scripts.git
          dest: "{{ scripts_source_dir }}"
        - repo: https://github.com/terminaldweller/minimalrc.git
          dest: "{{ minimalrc_source_dir }}"
        - repo: https://github.com/junegunn/fzf-git.sh.git
          dest: "{{ fzfgit_source_dir }}"
        - repo: https://github.com/romkatv/powerlevel10k.git
          dest: "{{ p10k_source_dir }}"
      loop_control:
        label: "{{ item.repo }}"

    - name: Copy configuration files from cloned repositories
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ managed_home }}/{{ item.dest }}"
        remote_src: true
        owner: "{{ managed_user }}"
        group: "{{ managed_group }}"
        mode: "0644"
      loop:
        - src: "{{ scripts_source_dir }}/.inputrc"
          dest: .inputrc
        - src: "{{ scripts_source_dir }}/.dir_colors"
          dest: .dir_colors
        - src: "{{ minimalrc_source_dir }}/.p10k.zsh"
          dest: .p10k.zsh
        - src: "{{ minimalrc_source_dir }}/.tmux.conf"
          dest: .tmux.conf
        - src: "{{ minimalrc_source_dir }}/.vimrc"
          dest: .vimrc
        - src: "{{ minimalrc_source_dir }}/.zshrc"
          dest: .zshrc
      loop_control:
        label: "{{ item.dest }}"

    - name: Remove unnecessary services
      ansible.builtin.apt:
        name:
          - cups
          - cups-daemon
          - cups-browsed
          - avahi-daemon
        state: absent
        purge: true

    - name: Enable and start services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - ssh
        - endlessh
        - chrony
        - jitterentropy
        - haveged
        - sshguard
        - nym-vpnd

    - name: set the UFW incoming policy
      community.general.ufw:
        direction: incoming
        default: deny

    - name: set the UFW outgoing policy
      community.general.ufw:
        direction: outgoing
        default: allow

    - name: add ufw allow rules
      community.general.ufw:
        rule: allow
        proto: tcp
        to_port: "{{ item.port }}"
        comment: "{{ item.comment }}"
      loop: "{{ ufw_allow_rules }}"
      loop_control:
        label: "{{ item.comment }}"

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    - name: Enable and start AppArmor
      ansible.builtin.systemd_service:
        name: apparmor
        enabled: true
        state: started

    - name: Verify AppArmor is enabled
      ansible.builtin.command:
        argv:
          - /usr/sbin/aa-status
          - --enabled
      changed_when: false

    - name: Install SSH hardening configuration
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          PermitEmptyPasswords no
          X11Forwarding no
          AllowUsers {{ managed_user }}
      notify: Restart SSH

    - name: Validate the SSH configuration
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -t
      changed_when: false

    - name: Ensure the SSHGuard blacklist file exists
      ansible.builtin.file:
        path: /etc/sshguard/sshguard.conf
        state: touch
        owner: root
        group: root
        mode: "0600"
        access_time: preserve
        modification_time: preserve
      notify: Restart SSHGuard

    - name: Configure SSHGuard blacklisting
      ansible.builtin.lineinfile:
        path: /etc/sshguard/sshguard.conf
        regexp: '^\s*#?\s*{{ item.name }}\s*='
        line: "{{ item.name }}={{ item.value }}"
        create: false
      loop:
        - name: THRESHOLD
          value: "10"
        - name: BLACKLIST_FILE
          value: "10:/etc/sshguard/blacklist"
        - name: IPV6_SUBNET
          value: "64"
        - name: IPV4_SUBNET
          value: "24"
      loop_control:
        label: "{{ item.name }}"
      notify: Restart SSHGuard

    - name: Read the NymVPN local-network policy
      ansible.builtin.command:
        argv:
          - /usr/bin/nym-vpnc
          - lan
          - get
      register: nym_lan_policy
      changed_when: false

    - name: Allow local-network traffic while NymVPN is connected
      ansible.builtin.command:
        argv:
          - /usr/bin/nym-vpnc
          - lan
          - set
          - allow
      when: "(nym_lan_policy.stdout | trim) != 'Local network policy: allow'"

  handlers:
    - name: Restart Docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
    - name: Restart SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted
    - name: Restart SSHGuard
      ansible.builtin.systemd_service:
        name: sshguard
        state: restarted
